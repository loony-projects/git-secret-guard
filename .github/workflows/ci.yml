name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-test:
    name: Lint, compile, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - run: npm run lint
        working-directory: extension
      - run: npm run unit-test
        working-directory: extension

  no-leak-grep:
    name: Grep for leaked fixture secrets
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - name: Run unit tests and capture all output
        run: npm run unit-test | tee /tmp/unit-test-output.txt
        working-directory: extension
      - name: Assert no raw fixture secret value appears in test output
        run: |
          set -euo pipefail
          fail=0
          for f in fixtures/secrets/*.txt; do
            # Pull out long tokens the same way noLeak.test.ts does, and confirm
            # none of them appear verbatim in anything the test run printed.
            grep -oE '[A-Za-z0-9_/+.=-]{16,}' "$f" | sort -u | while read -r token; do
              if grep -qF "$token" /tmp/unit-test-output.txt; then
                echo "LEAK: token from $f appeared in test output: ${token:0:4}..." >&2
                fail=1
              fi
            done
          done
          exit $fail

  integration-test:
    name: VS Code integration test (@vscode/test-electron)
    runs-on: ${{ matrix.os }}
    needs: lint-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
        working-directory: extension
      - run: npm test
        if: runner.os != 'Linux'
        working-directory: extension

  hook-round-trip:
    name: Hook install/uninstall round-trip (cross-platform)
    runs-on: ${{ matrix.os }}
    needs: lint-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - name: hookInstaller unit tests (exercises real git init on each OS)
        run: npx mocha out/test/unit/hookInstaller.test.js out/test/unit/hookScripts.test.js
        working-directory: extension

  package:
    name: Build .vsix (binary-less dev build)
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, no-leak-grep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - name: Package (no bundled gitleaks binary in this build)
        run: npx vsce package --no-dependencies
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: git-secret-guard-vsix
          path: extension/*.vsix

  # A release workflow (not this one) is expected to run, per platform:
  #   bash scripts/fetch-gitleaks.sh
  # before packaging, to produce a .vsix with a bundled gitleaks binary —
  # see docs/gitleaks-compatibility.md and extension/bin/README.md.
