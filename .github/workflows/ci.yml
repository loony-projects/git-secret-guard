name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-test:
    name: Lint, compile, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - run: npm run lint
        working-directory: extension
      - run: npm run unit-test
        working-directory: extension

  no-leak-grep:
    name: Grep for leaked fixture secrets
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - name: Run unit tests and capture all output
        run: npm run unit-test | tee /tmp/unit-test-output.txt
        working-directory: extension
      - name: Assert no raw fixture secret value appears in test output
        # Fixture secrets are generated at runtime from split string literals
        # (extension/src/test/unit/fixtures/secretFixtures.ts), not static
        # files, precisely so nothing secret-shaped sits in this repo's
        # committed content — so this check evaluates the compiled fixtures
        # module directly rather than grepping a file that no longer exists.
        run: |
          set -euo pipefail
          node -e '
            const { SECRET_FIXTURES } = require("./out/test/unit/fixtures/secretFixtures.js");
            const fs = require("fs");
            const output = fs.readFileSync("/tmp/unit-test-output.txt", "utf8");
            let leaked = false;
            for (const [name, content] of Object.entries(SECRET_FIXTURES)) {
              const tokens = new Set((content.match(/[A-Za-z0-9_/+.=-]{16,}/g)) || []);
              for (const token of tokens) {
                if (output.includes(token)) {
                  console.error(`LEAK: token from ${name} appeared in test output: ${token.slice(0, 4)}...`);
                  leaked = true;
                }
              }
            }
            process.exit(leaked ? 1 : 0);
          '
        working-directory: extension

  integration-test:
    name: VS Code integration test (@vscode/test-electron)
    runs-on: ${{ matrix.os }}
    needs: lint-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
        working-directory: extension
      - run: npm test
        if: runner.os != 'Linux'
        working-directory: extension

  hook-round-trip:
    name: Hook install/uninstall round-trip (cross-platform)
    runs-on: ${{ matrix.os }}
    needs: lint-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - name: hookInstaller unit tests (exercises real git init on each OS)
        run: npx mocha out/test/unit/hookInstaller.test.js out/test/unit/hookScripts.test.js
        working-directory: extension

  package:
    name: Build .vsix (binary-less dev build)
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, no-leak-grep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - name: Package (no bundled gitleaks binary in this build)
        run: npx vsce package --no-dependencies
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: git-secret-guard-vsix
          path: extension/*.vsix

  # A release workflow (not this one) is expected to run, per platform:
  #   bash scripts/fetch-gitleaks.sh
  # before packaging, to produce a .vsix with a bundled gitleaks binary —
  # see docs/gitleaks-compatibility.md and extension/bin/README.md.
